<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Page scroll fixture</title></head>
<body>
  <button id="page-start">Page start</button>
  <p>Start of a long document.</p>
  <div style="height: 1600px">Middle content</div>
  <a id="page-middle" href="#page-end">Page middle link</a>
  <div style="height: 1800px">More content</div>
  <button id="page-end">Page end</button>
</body>
</html>
