<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Horizontal scroll fixture</title></head>
<body>
  <div id="horizontal-container" style="width: 300px; overflow-x: auto">
    <table style="width: 2000px; table-layout: fixed">
      <tr>
        <td style="width: 100px"><button id="horizontal-start">Horizontal start</button></td>
        <td style="width: 1700px">Wide table content</td>
        <td style="width: 200px"><a id="horizontal-end" href="#horizontal-container">Horizontal end link</a></td>
      </tr>
    </table>
  </div>
</body>
</html>
